# Netlify only hosts the shared leaderboard API (netlify/functions). The game itself is
# on GitHub Pages (.github/workflows/pages.yml): Netlify's free plan adds a badge to
# every page. The site root just redirects there. See DEPLOY.md.
[build]
  command = "echo 'API only: the game is deployed to GitHub Pages'"
  publish = "netlify/site"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
